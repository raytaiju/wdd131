<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <meta name="description" content="Form page required for week 05 assignment, which allows users to submit a product review.">
    <meta name="author" content="Zhou Ray">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
    <title>Form assignment week 05</title>
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>
    <main>
        <form action="review.html" method="get">
            <label for="product">Product Name:</label><br>
            <select name="product" id="product" required>
                <option value="" disabled selected>Select a product</option>
            </select><br>

            <legend>Overall Rating</legend><br>
            <div class="ratingContainer">
                <label for="rating1" class="star">☆</label>
                <input type="radio" name="rating" id="rating1" value="1" required>
            </div>
            <div class="ratingContainer">
                <label for="rating2" class="star">☆☆</label>
                <input type="radio" name="rating" id="rating2" value="2" required>
            </div>
            <div class="ratingContainer">
                <label for="rating3" class="star">☆☆☆</label>
                <input type="radio" name="rating" id="rating3" value="3" required>
            </div>
            <div class="ratingContainer">
                <label for="rating4" class="star">☆☆☆☆</label>
                <input type="radio" name="rating" id="rating4" value="4" required>
            </div>
            <div class="ratingContainer">
                <label for="rating5" class="star">☆☆☆☆☆</label>
                <input type="radio" name="rating" id="rating5" value="5" required>
            </div><br>

            <label for="date">Date of Installation:</label><br>
            <input type="date" name="date" id="date" required><br>

            <fieldset>
                <legend>Which features did you find useful in the product?<br>(check all that apply)</legend>
                <div>
                    <input type="checkbox" name="usefulFeatures" id="feature1" value="Feature 1">
                    <label for="feature1">Durability</label>
                </div>
                <div>
                    <input type="checkbox" name="usefulFeatures" id="feature2" value="Feature 2">
                    <label for="feature2">Ease of use</label>
                </div>
                <div>
                    <input type="checkbox" name="usefulFeatures" id="feature3" value="Feature 3">
                    <label for="feature3">Performance</label>
                </div>
                <div>
                    <input type="checkbox" name="usefulFeatures" id="feature4" value="Feature 4">
                    <label for="feature4">Design</label>
                </div>
            </fieldset>

            <label for="review">Written Review:</label><br>
            <textarea name="review" id="review" rows="5" cols="30" placeholder="Write your review here..."></textarea><br>

            <label for="userName">Your Name:</label><br>
            <input type="text" name="userName" id="userName"><br>

            <input type="submit" value="Submit Review">
        </form>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> Zhou Ray Yu. Nigeria.</p>
        <p id="lastmodified"></p>
    </footer>
</body>
</html>
